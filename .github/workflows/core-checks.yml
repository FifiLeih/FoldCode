name: Core checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: core-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-core:
    name: JVM core and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK components
        shell: bash
        run: |
          foldcode_sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$foldcode_sdk_root" || ! -d "$foldcode_sdk_root/cmdline-tools" ]]; then
            echo "Android SDK command-line tools are unavailable" >&2
            exit 1
          fi

          foldcode_sdkmanager="$foldcode_sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$foldcode_sdkmanager" ]]; then
            foldcode_sdkmanager=$(find "$foldcode_sdk_root/cmdline-tools" \
              -type f -path '*/bin/sdkmanager' -perm -111 -print | sort -V | tail -n 1)
          fi
          if [[ -z "$foldcode_sdkmanager" || ! -x "$foldcode_sdkmanager" ]]; then
            echo "Could not locate sdkmanager below $foldcode_sdk_root/cmdline-tools" >&2
            exit 1
          fi

          # GitHub's bash enables pipefail. sdkmanager closes stdin after the
          # final accepted license, which makes `yes` exit through SIGPIPE even
          # though license acceptance succeeded.
          set +o pipefail
          yes | "$foldcode_sdkmanager" --licenses >/dev/null
          set -o pipefail

          "$foldcode_sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Run source-only core checks
        run: tools/test-core.sh --quick
